services:
  # ---------------------------------------------------------------------------
  # Worker A — Shared-Memory Writer
  # ---------------------------------------------------------------------------
  worker_a:
    build: ./worker_a
    container_name: tensoripc-writer
    # ipc: "shareable" — This flag tells Docker to give this container a
    # dedicated IPC (Inter-Process Communication) namespace AND explicitly
    # allows other containers to share it.  Inside Linux, features like
    # System V semaphores, POSIX message queues, and (crucially for us)
    # /dev/shm (shared memory) live in this namespace.  By making it
    # "shareable" we let Worker B attach to the same /dev/shm region.
    ipc: "shareable"
    # cpuset: "0,1" — Pin this container to physical CPU cores 0 and 1.
    # This guarantees deterministic CPU affinity for the writer process,
    # which is important when measuring low-level tensor throughput.
    cpuset: "0,1"
    # shm_size: '256m' — Expand /dev/shm from the tiny 64 MB default to
    # 256 MB so we have room for realistic tensor buffers without hitting
    # "Cannot allocate memory" errors from SharedMemory(create=True).
    shm_size: "256m"
    # healthcheck — A trivial command that passes as soon as the container
    # is running.  This lets worker_b use ``condition: service_healthy``
    # so it never tries to join the IPC namespace before worker_a is ready.
    healthcheck:
      test: ["CMD", "echo", "alive"]
      interval: 1s
      retries: 5
      start_period: 2s
    # Attach to the custom bridge network so the Gateway can route to us.
    networks:
      - tensor_net

  # ---------------------------------------------------------------------------
  # Worker B — Shared-Memory Reader
  # ---------------------------------------------------------------------------
  worker_b:
    build: ./worker_b
    container_name: tensoripc-reader
    # ipc: "container:worker_a" — Attach Worker B's IPC namespace to the
    # one already owned by Worker A.  This means any shared memory segment
    # created by Worker A (via multiprocessing.shared_memory) appears at
    # the same path in Worker B's /dev/shm, so the reader can open it
    # by name without any network round-trip.
    # NOTE: The value after "container:" must match worker_a's
    # ``container_name`` above (tensoripc-writer), NOT the Compose
    # service name (worker_a).  Docker resolves this at runtime by
    # looking for a running container with that exact name.
    ipc: "container:tensoripc-writer"
    # cpuset: "2,3" — Pin Worker B to cores 2 and 3.  Combined with the
    # Writer pinned to 0-1, the two processes will never fight over an L1
    # or L2 cache line, giving us a clean micro-benchmark environment.
    cpuset: "2,3"
    # Worker B should start only after Worker A is confirmed "healthy"
    # (i.e. its process is running inside the container).  This ensures
    # the target IPC namespace actually exists when Docker tries to join.
    restart: on-failure:3
    depends_on:
      worker_a:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Gateway — Multi-Stage Distroless Reverse Proxy (Go)
  # ---------------------------------------------------------------------------
  gateway:
    build: ./gateway
    container_name: tensoripc-gateway
    # Expose port 8000 to the host so external clients can reach the API.
    # The gateway listens inside the container on 8000 and proxies requests
    # to worker_a:8080 over the internal ``tensor_net`` bridge network.
    ports:
      - "8000:8000"
    # Resource limits — keep the gateway lean so Worker A gets most of the CPU.
    # cpus: '0.5'  — at most half a core.
    # mem_limit: '128M' — hard cap at 128 MB of RAM.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"
    # Attach to the same custom bridge network as Worker A so the reverse
    # proxy can resolve ``http://worker_a:8080`` via Docker's built-in DNS.
    networks:
      - tensor_net
    depends_on:
      - worker_a

  # ---------------------------------------------------------------------------
  # k6 — Load Generator
  # ---------------------------------------------------------------------------
  k6:
    # grafana/k6 is the official Docker image for the k6 load-testing tool.
    # It executes the JavaScript test script and reports metrics (RPS,
    # percentiles, failure rate) to stdout.
    image: grafana/k6:latest
    container_name: tensoripc-k6
    # Mount the local ``load_test/`` directory so the container can find our
    # ``script.js`` test definition.
    volumes:
      - ./load_test:/load_test
    # The command that k6 runs inside the container.
    # ``run`` tells k6 to execute a script; ``/load_test/script.js`` is the
    # test file we just mounted.
    command: run /load_test/script.js
    # Attach to the same bridge network so k6 can resolve ``gateway:8000``
    # and ``worker_a:8080`` via Docker DNS.
    networks:
      - tensor_net
    # k6 must start *after* the gateway and Worker A are fully up, otherwise
    # every request would fail with "connection refused".
    depends_on:
      gateway:
        condition: service_started
      worker_a:
        condition: service_started

# ---------------------------------------------------------------------------
# Custom bridge network
# ---------------------------------------------------------------------------
# A user-defined bridge network gives us automatic DNS resolution between
# containers (e.g. the gateway can resolve "worker_a" to Worker A's IP).
# The default bridge does NOT support DNS-based service discovery.
networks:
  tensor_net:
    driver: bridge
